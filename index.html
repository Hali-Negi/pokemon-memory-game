<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Memory Game</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Pokémon Memory Game</h1>

    <!-- Theme Switcher -->
    <div class="theme-toggle">
      <label for="themeSwitch">Dark Mode:</label>
      <input type="checkbox" id="themeSwitch" />
    </div>

    <!-- Game Info -->
    <div class="game-info">
      <p>Clicks: <span id="clicks">0</span></p>
      <p>Pairs Matched: <span id="matched">0</span></p>
      <p>Pairs Left: <span id="left">3</span></p>
    </div>

    <div class="game-ui">
      <p>Time Left: <span id="timer">--</span> seconds</p>

      <!-- Difficulty Selection -->
      <div class="difficulty-select">
        <label for="difficulty">Select Difficulty:</label>
        <select id="difficulty">
          <option value="easy" selected>Easy (3 pairs)</option>
          <option value="medium">Medium (6 pairs)</option>
          <option value="hard">Hard (9 pairs)</option>
        </select>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button id="startBtn">Start Game</button>
        <button id="resetBtn">Reset Game</button>
        <button id="powerUpBtn">Use Power-Up (Reveal All)</button>
      </div>
    </div>

    <div id="message" class="hidden"></div>

    <!-- Game Board (dynamically filled with cards) -->
    <div id="gameBoard" class="game-board"></div>

    <script src="script.js"></script>
  </body>
</html>
